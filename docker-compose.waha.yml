services:
  waha:
    image: devlikeapro/waha:latest
    container_name: sapa-waha
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - waha_sessions:/app/.sessions
    environment:
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WHATSAPP_API_PORT: 3000

volumes:
  waha_sessions:
